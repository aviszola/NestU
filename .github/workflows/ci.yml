name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Build
        run: npm run build
        env:
          # Dummy values biar build tidak gagal karena env missing
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          MIDTRANS_SERVER_KEY: 'placeholder'
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: 'placeholder'
          MIDTRANS_IS_PRODUCTION: 'false'
          MIDTRANS_WEBHOOK_SECRET: 'placeholder'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'